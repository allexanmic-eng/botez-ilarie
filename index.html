<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dfe9df">
<meta property="og:title" content="Botezul lui Ilarie Dumitru Ioan">
<meta property="og:description" content="17 octombrie 2026 • Galați">
<title>Botezul lui Ilarie Dumitru Ioan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e8eee7}
body{font-family:Georgia,"Times New Roman",serif}
.wrap{width:min(100%,600px);margin:auto;position:relative;background:#fff}
.invite{position:relative;width:100%;line-height:0}
.invite img{width:100%;height:auto;display:block}
.hotspot{position:absolute;display:block;border-radius:30px;text-indent:-9999px;overflow:hidden}
.hotspot:focus{outline:3px solid #c49a50;outline-offset:3px}
.wa{left:16%;right:16%;top:74.6%;height:7.7%}
.church{left:7%;width:43%;top:84%;height:7%}
.restaurant{right:7%;width:43%;top:84%;height:7%}
.hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font:12px Arial,sans-serif;color:#355044;background:#ffffffee;border:1px solid #b9c9ba;border-radius:20px;padding:8px 13px;box-shadow:0 4px 18px #0002;white-space:nowrap}
@media(min-width:601px){.wrap{box-shadow:0 0 35px #0002}.hint{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="invite">
    <img src="invitatie-verde.png" alt="Invitație de botez pentru Ilarie Dumitru Ioan">
    <a class="hotspot wa"
       href="https://wa.me/40748574379?text=Bun%C4%83!%20Confirm%C4%83m%20cu%20drag%20prezen%C8%9Ba%20la%20botezul%20lui%20Ilarie%20Dumitru%20Ioan%20din%2017%20octombrie%202026."
       aria-label="Confirmă prezența prin WhatsApp">Confirmă prezența</a>
    <a class="hotspot church"
       href="https://www.google.com/maps/search/?api=1&query=Biserica+Sf%C3%A2ntul+Mina+Gala%C8%9Bi"
       target="_blank" rel="noopener" aria-label="Locația bisericii">Biserica</a>
    <a class="hotspot restaurant"
       href="https://www.google.com/maps/search/?api=1&query=Magic+Events+Gala%C8%9Bi"
       target="_blank" rel="noopener" aria-label="Locația restaurantului">Restaurant</a>
  </div>
</main>
<div class="hint">Apasă pe „Confirmă prezența” pentru WhatsApp</div>
</body>
</html>
